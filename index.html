<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POP Studio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{display:flex;height:100vh;background:#f8fafc;overflow:hidden}
button{cursor:pointer}
/* --- FILE SYSTEM SIDEBAR --- */
.sidebar{width:240px;background:#0f172a;color:white;display:flex;flex-direction:column;flex-shrink:0}
.logo{padding:16px;border-bottom:1px solid #1e293b}
.logo b{font-size:20px} .logo b span{color:#38bdf8}
.logo small{color:#94a3b8;font-size:11px;display:block;margin-top:2px}
.files-head{padding:14px 14px 8px;display:flex;justify-content:space-between;align-items:center}
.files-head span{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#94a3b8;font-weight:700}
.new-file{background:#38bdf8;color:#0f172a;border:none;width:26px;height:26px;border-radius:8px;font-size:18px;font-weight:800;line-height:1}
.file-list{flex:1;overflow:auto;padding:0 8px}
.file-item{display:flex;justify-content:space-between;align-items:center;padding:10px 10px;border-radius:10px;margin-bottom:4px;cursor:pointer;border:1px solid transparent}
.file-item:hover{background:#1e293b}
.file-item.active{background:#1e293b;border-color:#38bdf8}
.file-item .name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-item .meta{font-size:10px;color:#94a3b8}
.file-item .del{background:none;border:none;color:#64748b;font-size:16px;padding:0 4px}
.file-item .del:hover{color:#f87171}
.sidebar-footer{padding:12px;border-top:1px solid #1e293b;font-size:12px;color:#94a3b8}
.sidebar-footer b{color:white}
/* --- MAIN --- */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{background:white;border-bottom:1px solid #e2e8f0;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.crumb{font-size:14px} .crumb b{font-size:16px}
.crumb small{color:#94a3b8;margin-left:6px}
.run-btn{background:#2563eb;color:white;border:none;padding:10px 24px;border-radius:10px;font-weight:800}
.run-btn:hover{background:#1d4ed8}
.editor-area{flex:1;display:flex;flex-direction:column;margin:12px 12px 6px;background:#0b1220;border-radius:14px;overflow:hidden}
.editor-head{color:#64748b;font-size:12px;padding:10px 14px;display:flex;justify-content:space-between}
#code{flex:1;background:transparent;color:#e2e8f0;border:none;outline:none;resize:none;padding:0 14px 14px;font-family:Consolas,monospace;font-size:15px;line-height:1.7}
.output-area{background:white;border:1px solid #e2e8f0;margin:0 12px 12px;border-radius:14px;overflow:hidden;flex:0.8;display:flex;flex-direction:column}
.output-head{padding:10px 14px;border-bottom:1px solid #f1f5f9;font-size:12px;font-weight:700;display:flex;justify-content:space-between}
#output{flex:1;padding:14px;font-family:Consolas,monospace;font-size:14px;white-space:pre-wrap;background:#f0fdf4;color:#14532d;overflow:auto}
@media(max-width:700px){.sidebar{display:none}}
</style>
</head>
<body>
<div class="sidebar">
  <div class="logo"><b>POP <span>Studio</span></b><small>Your Language • Your Files</small></div>
  <div class="files-head"><span>My Files</span><button class="new-file" id="newFileBtn" title="New File">+</button></div>
  <div class="file-list" id="fileList"></div>
  <div class="sidebar-footer">Made by <b>Rishi</b><br><span style="font-size:11px">No extension • Just Name</span></div>
</div>

<div class="main">
  <div class="topbar">
    <div class="crumb"><b id="currentFileName">main</b> <small>POP • Auto-saved</small></div>
    <div><span id="status" style="font-size:12px;color:#64748b;margin-right:10px">Ready</span><button id="runBtn" class="run-btn">▶ RUN</button></div>
  </div>
  <div class="editor-area"><div class="editor-head"><span>// POP Editor — Ctrl+Enter to Run</span><span id="charCount">0 chars</span></div><textarea id="code" spellcheck="false"></textarea></div>
  <div class="output-area"><div class="output-head"><span>Output</span><span>Terminal</span></div><pre id="output">Press RUN...</pre></div>
</div>

<script>
// --- FILE SYSTEM: Only Name, No Extension ---
let files = JSON.parse(localStorage.getItem('pop_files') || 'null');
if(!files){
  files = {
    'main': 'print"Hello POP!".',
    'hello': 'print"Hello from POP".',
    'calc': 'print(sqrt(16))\nprint(2 + 3)'
  };
  localStorage.setItem('pop_files', JSON.stringify(files));
}
let current = localStorage.getItem('pop_current') || 'main';
if(!files[current]) current = Object.keys(files)[0];

const codeEl=document.getElementById('code'), outputEl=document.getElementById('output'), statusEl=document.getElementById('status'), listEl=document.getElementById('fileList'), curEl=document.getElementById('currentFileName');

function save(){ localStorage.setItem('pop_files', JSON.stringify(files)); localStorage.setItem('pop_current', current); }
function renderList(){
  listEl.innerHTML='';
  Object.keys(files).forEach(name=>{
    const div=document.createElement('div');
    div.className='file-item'+(name===current?' active':'');
    div.innerHTML=`<div><div class="name">${name}</div><div class="meta">${files[name].length} chars • POP</div></div><button class="del">×</button>`;
    div.onclick=()=>{ switchFile(name); };
    div.querySelector('.del').onclick=(e)=>{ e.stopPropagation(); deleteFile(name); };
    div.ondblclick=()=>{ renameFile(name); };
    listEl.appendChild(div);
  });
  curEl.textContent=current;
  codeEl.value=files[current]||'';
  document.getElementById('charCount').textContent=codeEl.value.length+' chars';
}
function switchFile(name){ files[current]=codeEl.value; current=name; save(); renderList(); }
function deleteFile(name){
  if(Object.keys(files).length<=1){ alert('Keep at least 1 file'); return; }
  if(!confirm(`Delete file "${name}"?`)) return;
  delete files[name]; if(current===name) current=Object.keys(files)[0]; save(); renderList();
}
function renameFile(oldName){
  let n=prompt('Rename file (name only, no extension):', oldName);
  if(!n) return; n=n.trim().replace(/\.[a-z0-9]+$/i,''); // strip extension if user typed it
  if(!n || n===oldName) return;
  if(files[n]){ alert('File already exists'); return; }
  files[n]=files[oldName]; delete files[oldName]; if(current===oldName) current=n; save(); renderList();
}
document.getElementById('newFileBtn').onclick=()=>{
  let n=prompt('New file name (only name, no .pop / no extension):','newfile');
  if(!n) return; n=n.trim().replace(/\.[a-z0-9]+$/i,'');
  if(!n) return;
  if(files[n]){ alert('Already exists'); switchFile(n); return; }
  files[n]='print"Hello from '+n+'".';
  current=n; save(); renderList();
};
codeEl.addEventListener('input',()=>{ files[current]=codeEl.value; save(); document.getElementById('charCount').textContent=codeEl.value.length+' chars'; });
async function runCode(){
  files[current]=codeEl.value; save();
  statusEl.textContent='Running...'; outputEl.textContent='Running...';
  try{ const r=await fetch('/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:codeEl.value})}); const d=await r.json(); outputEl.textContent=d.output||'(no output)'; statusEl.textContent='Done ✓'; }
  catch(e){ outputEl.textContent='Error: Is py app.py running?'; statusEl.textContent='Error'; }
}
document.getElementById('runBtn').onclick=runCode;
codeEl.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); runCode(); } });
renderList();
</script>
</body>
</html>
</html>
