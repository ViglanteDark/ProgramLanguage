<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POP Studio</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
body { display: flex; height: 100vh; background: #f6f7f9; overflow: hidden; }
/* LEFT SIDEBAR - Your sketch left side */
.sidebar { width: 210px; background: #111827; color: white; display: flex; flex-direction: column; padding: 16px; flex-shrink: 0; }
.brand { font-weight: 800; font-size: 20px; margin-bottom: 4px; }
.brand span { color: #60a5fa; }
.brand-sub { font-size: 11px; color: #9ca3af; margin-bottom: 20px; }
.side-label { font-size: 11px; letter-spacing: 1px; color: #9ca3af; text-transform: uppercase; margin: 14px 0 8px; }
.ex-btn { width: 100%; text-align: left; background: #1f2937; color: white; border: 1px solid #374151; padding: 10px 12px; border-radius: 10px; cursor: pointer; margin-bottom: 8px; font-size: 13px; font-weight: 600; }
.ex-btn:hover { background: #374151; }
.add-btn { width: 100%; background: transparent; color: #9ca3af; border: 1px dashed #4b5563; padding: 10px; border-radius: 10px; cursor: pointer; margin-top: 4px; }
.name-box { margin-top: auto; background: #1f2937; padding: 12px; border-radius: 12px; }
.name-box small { color: #9ca3af; font-size: 11px; }
.name-box div { font-weight: 700; margin-top: 2px; }
/* MAIN AREA */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar { background: white; border-bottom: 1px solid #e5e7eb; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
.file { font-weight: 700; font-size: 14px; }
.file span { color: #9ca3af; font-weight: 400; font-size: 12px; margin-left: 6px; }
.run-btn { background: #2563eb; color: white; border: none; padding: 10px 22px; border-radius: 10px; font-weight: 800; cursor: pointer; font-size: 14px; }
.run-btn:hover { background: #1d4ed8; }
/* EDITOR + OUTPUT - stacked like your sketch */
.editor-wrap { flex: 1.3; background: #0f172a; display: flex; flex-direction: column; margin: 16px 16px 8px; border-radius: 14px; overflow: hidden; }
.editor-head { color: #94a3b8; font-size: 12px; padding: 10px 14px; }
#code { flex: 1; background: transparent; color: #a5f3fc; border: none; outline: none; resize: none; padding: 0 16px 16px; font-family: Consolas, monospace; font-size: 15px; line-height: 1.7; }
.output-wrap { flex: 1; background: white; border: 1px solid #e5e7eb; margin: 0 16px 16px; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
.output-head { padding: 10px 14px; border-bottom: 1px solid #f3f4f6; font-size: 12px; font-weight: 700; display: flex; justify-content: space-between; }
#output { flex: 1; padding: 14px; font-family: Consolas, monospace; font-size: 14px; white-space: pre-wrap; color: #14532d; background: #f0fdf4; overflow: auto; }
@media (max-width: 700px){ .sidebar{ display: none; } }
</style>
</head>
<body>
<div class="sidebar">
  <div class="brand">POP <span>Studio</span></div>
  <div class="brand-sub">Play • Code • Run</div>
  <div class="side-label">Examples</div>
  <button class="ex-btn" data-code='print("Hello POP!")'>👋 Hello</button>
  <button class="ex-btn" data-code='print(sqrt(16))'>√ Sqrt</button>
  <button class="ex-btn" data-code='print("POP is awesome")'>✦ Starter</button>
  <button class="add-btn" id="clearBtn">+ Clear / New</button>
  <div class="name-box"><small>Made by</small><div id="userName">Rishi</div></div>
</div>
<div class="main">
  <div class="topbar">
    <div class="file">main.pop <span>POP Language</span></div>
    <div><span id="status" style="font-size:12px;color:#6b7280;margin-right:10px;">Ready</span><button id="runBtn" class="run-btn">▶ RUN</button></div>
  </div>
  <div class="editor-wrap"><div class="editor-head">// Type your POP code here</div><textarea id="code" spellcheck="false">print("Hello POP!")</textarea></div>
  <div class="output-wrap"><div class="output-head"><span>Output</span><span>Terminal</span></div><pre id="output">Press RUN...</pre></div>
</div>
<script>
const codeEl=document.getElementById('code'), outputEl=document.getElementById('output'), statusEl=document.getElementById('status');
async function runCode(){ statusEl.textContent='Running...'; outputEl.textContent='Running...'; try{ const r=await fetch('/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:codeEl.value})}); const d=await r.json(); outputEl.textContent=d.output||'(no output)'; statusEl.textContent='Done ✓'; }catch(e){ outputEl.textContent='Error: Is py app.py running?'; statusEl.textContent='Error'; } }
document.getElementById('runBtn').onclick=runCode;
document.getElementById('clearBtn').onclick=()=>{ codeEl.value=''; codeEl.focus(); };
document.querySelectorAll('.ex-btn').forEach(b=>{ b.onclick=()=>{ codeEl.value=b.dataset.code; runCode(); }; });
codeEl.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); runCode(); } });
</script>
</body>
</html>
